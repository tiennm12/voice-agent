<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="../" />
    <!-- The address carries the access token: never send it on as a Referer. -->
    <meta name="referrer" content="no-referrer" />
    <title>Cuộc gọi nhỡ — Voice Agent</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main>
      <div id="call"><p class="muted">Đang tải…</p></div>
    </main>
    <script src="call-view.js"></script>
    <script>
      // One call, opened from the link under a Telegram notification: /c/<id>?t=<token>.
      // The token rides along on every request; with a dashboard session it isn't needed.
      const callId = location.pathname.split('/').pop();
      const token = new URLSearchParams(location.search).get('t');
      const access = token ? `?t=${encodeURIComponent(token)}` : '';
      const container = document.getElementById('call');

      fetch(`api/calls/${callId}${access}`)
        .then((response) => (response.ok ? response.json() : Promise.reject(response.status)))
        .then((call) => {
          renderCall(container, call, (path) => `api/calls/${callId}/${path}${access}`);
          // Opening the link is reading the call: it stops the urgent reminders.
          return fetch(`api/calls/${callId}/read${access}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ read: true }),
          });
        })
        .catch(() => {
          container.replaceChildren(element('p', 'status error', 'Liên kết đã hết hạn hoặc cuộc gọi đã bị xoá.'));
        });
    </script>
  </body>
</html>
