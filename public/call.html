<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Gọi thử — Voice Agent</title>
    <style>
      body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
      #status { font-weight: bold; }
      #transcript { margin-top: 16px; border-top: 1px solid #ccc; padding-top: 8px; }
      fieldset { margin: 12px 0; }
      label { display: block; margin: 6px 0; }
      label small { color: #666; }
      .use { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 8px; background: #e6f0ff; color: #245; font-size: 12px; }
      label.off { opacity: 0.45; }
      label.off .use { background: #eee; color: #555; }
      #fit { color: #245; background: #f3f7ff; padding: 6px 10px; border-radius: 6px; }
      select, input { margin-left: 6px; }
      input[type=number] { width: 80px; }
      button { font-size: 16px; padding: 8px 16px; margin-right: 8px; }
    </style>
  </head>
  <body>
    <p><a href="./">← Hộp thư</a></p>
    <h1>Gọi thử</h1>
    <p>Nói chuyện với trợ lý qua micro của máy này, như một người gọi đến.</p>
    <p>
      Mic: <span id="mode"></span>
      (<a id="modeLink"></a>; nếu tiếng bị rè, giật hoặc nhận dạng sai nhiều thì thử đổi)
    </p>
    <details id="settings" open>
      <summary>Cài đặt thử (chỉ áp dụng cho cuộc gọi này)</summary>
      <p id="fit"></p>
      <fieldset>
        <legend>Kiểu xử lý</legend>
        <label>
          Pipeline
          <select name="pipeline">
            <option value="">mặc định của máy chủ</option>
            <option value="classic">classic: nhận dạng → chat model → ElevenLabs</option>
            <option value="realtime">realtime: một model nghe và nói (giọng OpenAI)</option>
            <option value="hybrid">hybrid: model realtime nghe, trả lời bằng chữ → ElevenLabs đọc</option>
            <option value="live">live: GPT-Live, vừa nghe vừa nói (giọng OpenAI)</option>
            <option value="blind">nghe mù: máy chọn ngẫu nhiên, chỉ báo là pipeline nào khi cuộc gọi kết thúc</option>
          </select>
        </label>
        <label>
          Giọng live
          <select name="live_voice">
            <option value="">mặc định (marin)</option>
            <option>marin</option>
            <option>cedar</option>
            <option>quartz</option>
            <option>ripple</option>
            <option>vesper</option>
            <option>willow</option>
            <option>stone</option>
            <option>gleam</option>
            <option>meridian</option>
            <option>bossa</option>
            <option>tempo</option>
            <option>beacon</option>
            <option>delta</option>
            <option>cinder</option>
          </select>
        </label>
        <label>
          Model realtime
          <select name="agent_model">
            <option value="">mặc định</option>
            <option>gpt-realtime-2.1-mini</option>
            <option>gpt-realtime-2.1</option>
            <option>gpt-realtime-mini</option>
          </select>
          <small>chỉ hai model đầu có giá trong pricing.json</small>
        </label>
        <label>
          Giọng realtime
          <select name="agent_voice">
            <option value="">mặc định (marin)</option>
            <option>marin</option>
            <option>cedar</option>
            <option>alloy</option>
            <option>ash</option>
            <option>coral</option>
            <option>sage</option>
            <option>shimmer</option>
            <option>verse</option>
          </select>
        </label>
        <label>
          Cách chốt câu
          <select name="vad_type">
            <option value="">mặc định (server_vad)</option>
            <option value="server_vad">server_vad: theo thời gian im lặng</option>
            <option value="semantic_vad">semantic_vad: theo nội dung câu nói</option>
          </select>
        </label>
        <label>
          Semantic VAD vội đến mức nào
          <select name="vad_eagerness">
            <option value="">mặc định</option>
            <option>low</option>
            <option>medium</option>
            <option>high</option>
          </select>
          <small>high = trả lời sớm hơn; ô im lặng và ngưỡng bên dưới không áp dụng cho semantic_vad</small>
        </label>
      </fieldset>
      <fieldset>
        <legend>Nhận dạng giọng</legend>
        <label>
          Dịch vụ
          <select name="stt_provider">
            <option value="">mặc định của máy chủ</option>
            <option value="openai">OpenAI (gpt-4o-transcribe)</option>
            <option value="elevenlabs">ElevenLabs Scribe v2 Realtime</option>
            <option value="soniox">Soniox v5 (chốt câu theo ngữ nghĩa)</option>
          </select>
        </label>
        <label>
          Soniox chốt câu sớm (0–3)
          <input type="number" name="soniox_endpoint_level" min="0" max="3" step="1" placeholder="mặc định" />
          <small>cao = trả lời sớm hơn nhưng dễ cắt ngang. Ô im lặng bên dưới = thời gian chờ tối đa (500–3000)</small>
        </label>
        <label>
          Model OpenAI
          <select name="openai_transcribe_model">
            <option value="">mặc định</option>
            <option>gpt-4o-transcribe</option>
            <option>gpt-4o-mini-transcribe</option>
          </select>
        </label>
        <label>
          Im lặng bao lâu thì chốt câu (ms)
          <input type="number" name="vad_silence_ms" min="100" max="3000" step="50" placeholder="mặc định" />
          <small>nhỏ = trả lời sớm nhưng dễ cắt ngang khi người gọi ngắt quãng</small>
        </label>
        <label>
          Ngưỡng nhận tiếng nói (0–1)
          <input type="number" name="vad_threshold" min="0" max="1" step="0.05" placeholder="mặc định" />
          <small>cao = bỏ qua nhiễu tốt hơn; thang của OpenAI và Scribe có thể khác nhau</small>
        </label>
        <label>
          Bỏ câu nghe không chắc, log-prob dưới
          <input type="number" name="stt_min_logprob" min="-5" max="0" step="0.1" placeholder="tắt" />
          <small>ví dụ -1</small>
        </label>
      </fieldset>
      <fieldset>
        <legend>Trả lời</legend>
        <label>
          Model chat
          <select name="openai_chat_model">
            <option value="">mặc định</option>
            <option>gpt-6-luna</option>
            <option>gpt-4.1-mini</option>
            <option>gpt-4o-mini</option>
            <option>gpt-4.1-nano</option>
          </select>
          <small>chi phí ghi trong hộp thư vẫn tính theo giá model mặc định</small>
        </label>
        <label>
          Model giọng đọc
          <select name="elevenlabs_model_id">
            <option value="">mặc định</option>
            <option>eleven_flash_v2_5</option>
            <option>eleven_turbo_v2_5</option>
          </select>
        </label>
        <label>
          Auto mode giọng đọc
          <select name="elevenlabs_auto_mode">
            <option value="">mặc định</option>
            <option value="1">bật (đọc ngay từng cụm)</option>
            <option value="0">tắt</option>
          </select>
        </label>
      </fieldset>
    </details>
    <p>Trạng thái: <span id="status">idle</span></p>
    <button id="startButton">Bắt đầu gọi</button>
    <button id="endButton">Kết thúc</button>
    <div id="transcript"></div>
    <script>
      const raw = new URLSearchParams(location.search).has('raw');
      document.getElementById('mode').textContent = raw ? 'thô (không xử lý)' : 'xử lý của Chrome (mặc định)';
      const link = document.getElementById('modeLink');
      link.textContent = raw ? 'dùng xử lý của Chrome' : 'thử mic thô';
      link.href = raw ? 'call.html' : 'call.html?raw=1';
    </script>
    <script>
      // Remembered between visits; localStorage can be unavailable (private window), so every access is guarded.
      const fields = document.querySelectorAll('#settings [name]');
      const KEY = 'callSettings';
      function saved() {
        try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
      }
      const previous = saved();
      fields.forEach((field) => {
        field.value = previous[field.name] ?? '';
        field.addEventListener('change', () => {
          try { localStorage.setItem(KEY, JSON.stringify(currentOptions())); } catch { /* not remembered */ }
          refresh();
        });
      });
      function currentOptions() {
        const options = {};
        fields.forEach((field) => { if (field.value !== '') options[field.name] = field.value; });
        return options;
      }

      // Which options a pipeline actually reads (mirrors build_agent in server.py). A rule says false only when the
      // option is certainly unused; "" (the server's default) or the blind pick leave the pipeline unknown, so
      // everything stays on. `v` holds every field's value, '' when unset.
      const any = (value, ...allowed) => value === '' || allowed.includes(value);
      const openaiStt = (v) => any(v.pipeline, 'realtime', 'hybrid') || (v.pipeline === 'classic' && any(v.stt_provider, 'openai'));
      const semantic = (v) => v.vad_type === 'semantic_vad' && openaiStt(v) && v.pipeline !== '' && (v.pipeline !== 'classic' || v.stt_provider === 'openai');
      const RULES = {
        live_voice: ['live', (v) => any(v.pipeline, 'live')],
        agent_model: ['realtime, hybrid', (v) => any(v.pipeline, 'realtime', 'hybrid')],
        agent_voice: ['realtime', (v) => any(v.pipeline, 'realtime')],
        vad_type: ['realtime, hybrid, classic + OpenAI', openaiStt],
        vad_eagerness: ['khi chọn semantic_vad', (v) => openaiStt(v) && v.vad_type === 'semantic_vad'],
        stt_provider: ['classic', (v) => any(v.pipeline, 'classic')],
        soniox_endpoint_level: ['classic + Soniox', (v) => any(v.pipeline, 'classic') && any(v.stt_provider, 'soniox')],
        openai_transcribe_model: ['realtime, hybrid, classic + OpenAI', openaiStt],
        vad_silence_ms: ['mọi pipeline nghe, trừ semantic_vad', (v) => v.pipeline !== 'live' && !semantic(v)],
        vad_threshold: ['realtime, hybrid, classic + OpenAI/ElevenLabs, trừ semantic_vad',
          (v) => v.pipeline !== 'live' && !semantic(v) && !(v.pipeline === 'classic' && v.stt_provider === 'soniox')],
        stt_min_logprob: ['classic + OpenAI', (v) => any(v.pipeline, 'classic') && any(v.stt_provider, 'openai')],
        openai_chat_model: ['classic', (v) => any(v.pipeline, 'classic')],
        elevenlabs_model_id: ['classic, hybrid', (v) => any(v.pipeline, 'classic', 'hybrid')],
        elevenlabs_auto_mode: ['classic, hybrid', (v) => any(v.pipeline, 'classic', 'hybrid')],
      };
      const PIPELINE_NAMES = ['classic', 'realtime', 'hybrid', 'live'];
      function values(options) {
        const v = Object.fromEntries([...fields].map((field) => [field.name, options[field.name] ?? '']));
        if (!PIPELINE_NAMES.includes(v.pipeline)) v.pipeline = '';  // default or blind: unknown
        return v;
      }
      fields.forEach((field) => {
        const rule = RULES[field.name];
        if (!rule) return;
        const badge = document.createElement('span');
        badge.className = 'use';
        badge.textContent = `dùng cho: ${rule[0]}`;
        field.closest('label').append(badge);
      });
      function refresh() {
        const v = values(currentOptions());
        let active = 0;
        fields.forEach((field) => {
          const rule = RULES[field.name];
          const on = !rule || rule[1](v);
          field.disabled = !on;
          field.closest('label').classList.toggle('off', !on);
          if (rule && on) active += 1;
        });
        document.getElementById('fit').textContent = v.pipeline
          ? `Pipeline ${v.pipeline}: ${active}/${Object.keys(RULES).length} tuỳ chọn bên dưới có tác dụng, các ô mờ thì bị bỏ qua.`
          : 'Chưa biết pipeline (mặc định của máy chủ hoặc nghe mù): các ô đều bật; nhãn "dùng cho" cho biết ô nào của pipeline nào.';
      }
      refresh();
      // client.js reads window.callOptions when the call starts; the capture listener runs before its own click handler.
      // Blind listening test: the pipeline is drawn at random and named only once the call is over,
      // together with its waits (client.js holds the latency lines back meanwhile: they would give it away).
      const PIPELINES = ['classic', 'hybrid', 'realtime', 'live'];
      document.getElementById('startButton').addEventListener('click', () => {
        const options = currentOptions();
        window.blindTest = null;
        if (options.pipeline === 'blind') {
          options.pipeline = PIPELINES[Math.floor(Math.random() * PIPELINES.length)];
          window.blindTest = { pipeline: options.pipeline, waits: [] };
        }
        // Options the chosen pipeline ignores are left out (the saved form keeps them).
        const v = values(options);
        for (const name of Object.keys(options)) if (RULES[name] && !RULES[name][1](v)) delete options[name];
        window.callOptions = options;
        const chosen = Object.entries(options).map(([k, v]) => `${k}=${v}`).join(', ');
        appendTranscript('cài đặt', window.blindTest ? 'nghe mù' : chosen || 'mặc định');
      }, true);
      new MutationObserver(() => {
        const test = window.blindTest;
        if (!test || document.getElementById('status').textContent !== 'idle') return;
        window.blindTest = null;
        const waits = test.waits.slice().sort((a, b) => a - b);
        const median = waits.length ? `, chờ trung vị ${waits[Math.floor(waits.length / 2)]}ms qua ${waits.length} lượt` : '';
        appendTranscript('nghe mù', `pipeline vừa rồi là ${test.pipeline}${median}`);
      }).observe(document.getElementById('status'), { childList: true, characterData: true, subtree: true });
    </script>
    <script src="pcm-player.js"></script>
    <script src="client.js"></script>
  </body>
</html>
