# Voice Agent (voicemail bot + test call page): chatbot2.vietnamobile.ai/voiceagent/ -> 127.0.0.1:3000.
# Appended to /etc/nginx/chatbot2-locations.conf on the prod server, inside the server block that
# already sets the proxy headers and the WebSocket Upgrade/Connection map.
# Prefix stripped by the trailing slash on proxy_pass; the frontend uses page-relative URLs.
# proxy_redirect/proxy_cookie_path put the prefix back on its redirects and session cookie.
location = /voiceagent { absolute_redirect off; return 301 /voiceagent/; }
location /voiceagent/ {
    proxy_pass http://127.0.0.1:3000/;
    absolute_redirect off;
    proxy_redirect / /voiceagent/;
    proxy_cookie_path / /voiceagent/;
    # Call links carry their access token in the query string (?t=...), and the default log format
    # writes it down, readable by anyone with this shared server's logs. The app keeps no access log either.
    access_log off;
    # TLS ends in front of this nginx (it only listens on 80); tell the app, so the session cookie is Secure.
    # Any proxy_set_header here drops every inherited one, so the rest are repeated: the WebSocket
    # needs Upgrade/Connection, and the app's same-origin check needs the real Host.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
